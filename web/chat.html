<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat · ClawCommerce</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0b141a;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}

/* Phone Frame */
.phone-frame{width:390px;height:100vh;max-height:844px;background:#0b141a;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,0.5)}
@media(max-width:430px){.phone-frame{width:100vw;height:100vh;max-height:none;border-radius:0}}

.phone-notch{height:30px;background:#000;position:relative;z-index:10}
.phone-notch-inner{width:120px;height:25px;background:#000;border-radius:0 0 18px 18px;margin:0 auto}
.phone-status-bar{display:flex;justify-content:space-between;align-items:center;padding:2px 20px 4px;background:#000;color:white;font-size:12px;font-weight:600;z-index:10}
.phone-status-icons{display:flex;gap:4px;align-items:center}
.phone-time{font-variant-numeric:tabular-nums}
.phone-home-bar{height:20px;background:#0b141a;display:flex;align-items:center;justify-content:center}
.phone-home-bar::after{content:'';width:134px;height:5px;background:#fff;border-radius:3px;opacity:0.3}

/* App */
.app{flex:1;display:flex;flex-direction:column;overflow:hidden;background:url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' width='40' height='40' patternUnits='userSpaceOnUse'%3E%3Ccircle cx='20' cy='20' r='1' fill='%23ffffff' opacity='0.015'/%3E%3C/pattern%3E%3C/defs%3E%3Crect fill='%23080f14' width='400' height='400'/%3E%3Crect fill='url(%23p)' width='400' height='400'/%3E%3C/svg%3E")}

/* Header */
.chat-header{display:flex;align-items:center;padding:8px 10px;background:#1f2c34;gap:8px;min-height:56px;z-index:5}
.chat-header-back{color:white;display:flex;align-items:center;opacity:0.7}
.chat-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#2a3942}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-avatar-letter{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;background:var(--store-color,#8b5cf6)}
.chat-header-info{flex:1;min-width:0}
.chat-header-info h2{font-size:15px;font-weight:500;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-status{font-size:12px;color:#8696a0}
.chat-header-actions{display:flex;gap:14px;color:#aebac1}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:8px 16px 10px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:#2a3942;border-radius:4px}

.encrypted-notice{text-align:center;background:rgba(25,55,70,0.4);color:#8696a0;font-size:11px;padding:6px 16px;border-radius:8px;margin:10px auto;max-width:320px;display:flex;align-items:center;justify-content:center;gap:6px}
.encrypted-notice svg{width:12px;height:12px;fill:#8696a0}
.date-separator{text-align:center;color:#8696a0;font-size:11px;font-weight:500;background:#1b2831;padding:4px 14px;border-radius:8px;margin:8px auto;width:fit-content}

.msg{margin-bottom:2px;display:flex}
.msg.bot{justify-content:flex-start}
.msg.user{justify-content:flex-end}
.msg-bubble{max-width:85%;padding:6px 8px 4px;border-radius:8px;font-size:14px;line-height:1.45;position:relative;word-wrap:break-word}
.msg.bot .msg-bubble{background:#1f2c34;color:#e9edef;border-top-left-radius:0}
.msg.user .msg-bubble{background:#005c4b;color:#e9edef;border-top-right-radius:0}
.msg-sender{display:block;font-size:12px;font-weight:500;color:var(--store-color,#8b5cf6);margin-bottom:2px}
.msg-time{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:#8696a0;margin-top:2px}
.msg-ticks svg{width:16px;height:11px;fill:#53bdeb}

/* Product Cards */
.msg-product-card{border-radius:8px;overflow:hidden;background:#111b21;border:1px solid #2a3942;cursor:pointer;transition:border-color 0.2s}
.msg-product-card:hover{border-color:var(--store-color,#8b5cf6)}
.msg-product-card img{width:100%;max-height:180px;object-fit:cover;display:block}
.msg-product-card-body{padding:10px 12px}
.msg-product-card-body h4{font-size:14px;font-weight:600;color:white;margin-bottom:4px;line-height:1.3}
.msg-product-card-body .price{font-size:16px;font-weight:700;color:#25d366}
.msg-product-card-body .old-price{font-size:12px;color:#8696a0;text-decoration:line-through;margin-left:6px}
.msg-product-card-body .category-tag{font-size:11px;color:#8696a0;margin-top:4px;display:block}
.msg-product-card-body .desc{font-size:12px;color:#8696a0;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Image messages */
.msg-image{border-radius:6px;overflow:hidden;margin:2px 0}
.msg-image img{width:100%;display:block;max-height:250px;object-fit:cover}
.msg-image-price{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.7);color:#25d366;padding:3px 10px;border-radius:12px;font-size:14px;font-weight:700}
.msg-image-caption{padding:4px 4px 0;font-size:13px;color:#e9edef}

/* Quick Actions */
.quick-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick-action{background:#1a2e35;border:1px solid #2a3942;color:#e9edef;padding:6px 14px;border-radius:18px;font-size:13px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.quick-action:hover{background:#25d366;color:#111b21;border-color:#25d366}

/* Pay button */
.btn-pay{display:inline-block;background:#25d366;color:#111b21;padding:10px 24px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px;margin:4px 0;transition:opacity 0.2s}
.btn-pay:hover{opacity:0.9}

/* Typing */
.typing{display:flex;padding:0 16px;margin-bottom:2px}
.typing-dots{background:#1f2c34;padding:10px 16px;border-radius:8px;border-top-left-radius:0;display:flex;gap:4px;align-items:center}
.typing-dots span{width:7px;height:7px;background:#8696a0;border-radius:50%;animation:typing 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-4px);opacity:1}}

/* Input */
.input-area{display:flex;align-items:flex-end;padding:6px 8px;background:#1f2c34;gap:6px}
.input-emoji{font-size:22px;cursor:pointer;padding:6px;user-select:none}
.input-wrapper{flex:1;background:#2a3942;border-radius:24px;display:flex;align-items:flex-end;padding:4px 12px;min-height:40px}
.input-wrapper textarea{flex:1;background:none;border:none;color:#e9edef;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:100px;line-height:1.4;padding:6px 0}
.input-wrapper textarea::placeholder{color:#8696a0}
.input-attach{cursor:pointer;font-size:18px;padding:4px;user-select:none}
.send-btn{width:42px;height:42px;border-radius:50%;background:#25d366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.2s}
.send-btn:hover{opacity:0.9}
.send-btn:disabled{opacity:0.5}
.send-btn svg{width:20px;height:20px;fill:white;margin-left:2px}

/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:#0b141a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.5s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:50px;height:50px;border:3px solid #2a3942;border-top-color:var(--store-color,#8b5cf6);border-radius:50%;animation:spin 0.8s linear infinite}
.loading-text{color:#8696a0;font-size:14px;margin-top:16px}
@keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading store...</div>
    </div>

    <div class="phone-frame">
        <div class="phone-notch"><div class="phone-notch-inner"></div></div>
        <div class="phone-status-bar">
            <span class="phone-time" id="phoneTime">12:00</span>
            <div class="phone-status-icons">
                <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><path d="M1 8h2v4H1V8zm4-3h2v7H5V5zm4-3h2v10H9V2zm4-2h2v12h-2V0z" opacity="0.9"/></svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><path d="M8 2C5.8 2 3.8 2.9 2.3 4.3l1.4 1.4C5 4.5 6.4 3.8 8 3.8s3 .7 4.3 1.9l1.4-1.4C12.2 2.9 10.2 2 8 2zm0 4c-1.3 0-2.5.5-3.5 1.4L5.9 8.8c.6-.6 1.3-.9 2.1-.9s1.5.3 2.1.9l1.4-1.4C10.5 6.5 9.3 6 8 6zm0 4c-.6 0-1.1.2-1.5.6L8 12.3l1.5-1.7c-.4-.4-.9-.6-1.5-.6z" opacity="0.9"/></svg>
                <svg width="24" height="12" viewBox="0 0 24 12" fill="white"><rect x="0" y="1" width="20" height="10" rx="2" stroke="white" stroke-width="1.3" fill="none" opacity="0.4"/><rect x="21" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.4"/><rect x="1.5" y="2.5" width="14" height="7" rx="1" fill="white" opacity="0.9"/></svg>
            </div>
        </div>

        <div class="app">
            <div class="chat-header">
                <div class="chat-header-back">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
                <div class="chat-avatar" id="chatAvatar">
                    <span class="chat-avatar-letter" id="avatarLetter">S</span>
                </div>
                <div class="chat-header-info">
                    <h2 id="storeName">Store</h2>
                    <div class="chat-header-status" id="headerStatus">online</div>
                </div>
                <div class="chat-header-actions">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <span class="input-emoji">😊</span>
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Message" rows="1"></textarea>
                    <span class="input-attach">📎</span>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

        <div class="phone-home-bar"></div>
    </div>

    <script src="chat-app.js"></script>
</body>
</html>
