<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andafacil · WhatsApp</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar (desktop only) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">🦽</div>
                    <div class="brand-name">Andafacil</div>
                </div>
            </div>

            <div class="product-section">
                <div class="product-section-title">📦 Productos</div>
            </div>

            <div class="product-list" id="productList"></div>

            <div class="sidebar-footer">
                Powered by <a href="https://openclaw.ai" target="_blank">OpenClaw</a>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- WhatsApp Header -->
            <div class="chat-header">
                <span class="chat-header-back">←</span>
                <div class="chat-avatar">
                    <span class="chat-avatar-letter">A</span>
                </div>
                <div class="chat-header-info">
                    <h2>Andafacil 🦽</h2>
                    <div class="chat-header-status">en línea</div>
                </div>
                <div class="chat-header-actions">
                    <!-- Video call -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    <!-- Phone -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    <!-- Menu -->
                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages"></div>

            <!-- Input Area -->
            <div class="input-area">
                <span class="input-emoji">😊</span>
                <div class="input-wrapper">
                    <textarea
                        id="userInput"
                        placeholder="Mensaje"
                        rows="1"
                    ></textarea>
                    <div class="input-attach">
                        <span>📎</span>
                    </div>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
